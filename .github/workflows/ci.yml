name: Selenium Test CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

    
      - name: Clear WebDriverManager cache
        run: rmdir /s /q %USERPROFILE%\.cache\selenium || echo "No cache"

      - name: Build and Test
        run: mvn clean test
